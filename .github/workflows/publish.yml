name: Publish plugin release

# Tag-triggered: push a tag like v0.1.6 and this builds the plugin and
# attaches <plugin>-<tag>.zip to the GitHub release. The Logseq marketplace
# installs from that zip — GitHub's own "Source code" archive is not enough,
# because it contains no built output (dist/ is gitignored).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_NAME: logseq-timeline-plugin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Assemble plugin package
        run: |
          mkdir -p "$PLUGIN_NAME"
          cp -r dist "$PLUGIN_NAME/"
          cp package.json icon.svg README.md LICENSE "$PLUGIN_NAME/"
          zip -r "$PLUGIN_NAME-${GITHUB_REF_NAME}.zip" "$PLUGIN_NAME"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip
          generate_release_notes: true
